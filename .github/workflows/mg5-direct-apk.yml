name: MG5 Direct APK (Alpha)
on:
  push:
    branches: [mg5-dashboard-v1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preserve debug signing key for later alpha updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mg5-dashboard-stable-signing-alpha6-v1
      - name: Initialize persistent debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build Android 12 debug APK
        run: gradle assemblePlayDebug --no-daemon --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/play/debug/app-play-debug.apk MG5-Dashboard-TS10S-alpha6.apk
      - name: Publish pre-release for easy phone download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create mg5-ts10s-alpha6 MG5-Dashboard-TS10S-alpha6.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MG5 Dashboard - TS10S Alpha 6" \
            --notes "Unverified test build for TS10S Android 12. Do not set as default launcher until tested. Source: mg5-dashboard-v1 branch. GPL-3.0." \
            --prerelease
